<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 988 580.5" width="988" height="580.5" font-family="ui-sans-serif, system-ui, sans-serif">
<defs><marker id="spitze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="16" y="-4" width="988" height="580.5" fill="#ffffff"/>
<rect x="40" y="110" width="380" height="110" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<rect x="40" y="250" width="380" height="110" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
<rect x="520" y="140" width="460" height="50" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<line x1="750" y1="190" x2="750" y2="202" stroke="#1e1e1e" stroke-width="2" marker-end="url(#spitze)"/>
<rect x="520" y="202" width="460" height="50" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<line x1="750" y1="252" x2="750" y2="264" stroke="#1e1e1e" stroke-width="2" marker-end="url(#spitze)"/>
<rect x="520" y="264" width="460" height="50" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<line x1="750" y1="314" x2="750" y2="326" stroke="#1e1e1e" stroke-width="2" marker-end="url(#spitze)"/>
<rect x="520" y="326" width="460" height="50" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="40" y="41" fill="#1e1e1e" font-size="22" text-anchor="start" >Zwei Fehlerklassen — und die Reihenfolge</text>
<text x="40" y="62" fill="#1e1e1e" font-size="13" text-anchor="start" >Die Klasse entscheidet über die Reaktion, nicht der Fehlertext.  (E-03)</text>
<text x="230" y="150" fill="#2f9e44" font-size="16" text-anchor="middle" font-weight="600">VORÜBERGEHEND     rc 69</text>
<text x="230" y="170" fill="#2f9e44" font-size="16" text-anchor="middle" font-weight="600">Netz weg · 5xx · Drosselung</text>
<text x="230" y="190" fill="#2f9e44" font-size="16" text-anchor="middle" font-weight="600">→ nichts tun, nächster Lauf holt es</text>
<text x="230" y="290" fill="#e03131" font-size="16" text-anchor="middle" font-weight="600">DAUERHAFT     rc 77</text>
<text x="230" y="310" fill="#e03131" font-size="16" text-anchor="middle" font-weight="600">401 · 403 · 404 · Fehlkonfiguration</text>
<text x="230" y="330" fill="#e03131" font-size="16" text-anchor="middle" font-weight="600">→ erneut hilft NIE, sofort melden</text>
<text x="40" y="393" fill="#1e1e1e" font-size="14" text-anchor="start" >Ein Job, der beides gleich behandelt,</text>
<text x="40" y="411" fill="#1e1e1e" font-size="14" text-anchor="start" >ist entweder laut oder blind.</text>
<text x="520" y="117" fill="#1e1e1e" font-size="18" text-anchor="start" >Die Reihenfolge ist die Idempotenz</text>
<text x="750" y="170" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">1  prüfen      DMARC-Gate</text>
<text x="750" y="232" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">2  kappen      Rumpf auf 4'000 Zeichen</text>
<text x="750" y="294" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">3  hochladen   Datei + ALLE Spalten in einem Zug</text>
<text x="750" y="356" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">4  wegräumen   Mail verschieben — erst jetzt</text>
<text x="520" y="413" fill="#1e1e1e" font-size="14" text-anchor="start" >Bricht der Lauf zwischen 3 und 4 ab,</text>
<text x="520" y="431" fill="#1e1e1e" font-size="14" text-anchor="start" >wiederholt der nächste — statt zu verlieren.</text>
<text x="520" y="448" fill="#1e1e1e" font-size="14" text-anchor="start" ></text>
<text x="520" y="466" fill="#1e1e1e" font-size="14" text-anchor="start" >Umgekehrt wäre die Mail weg</text>
<text x="520" y="483" fill="#1e1e1e" font-size="14" text-anchor="start" >und das Dokument nicht da.</text>
<text x="520" y="513" fill="#e03131" font-size="14" text-anchor="start" >Namensgleichheit ist kein Beweis für Identität:</text>
<text x="520" y="531" fill="#e03131" font-size="14" text-anchor="start" >gleicher Name + gleicher Eingang  →  ersetzen</text>
<text x="520" y="548" fill="#e03131" font-size="14" text-anchor="start" >gleicher Name + anderer Eingang   →  zweites Dokument</text>
</svg>