<text x="40" y="41" fill="#1e1e1e" font-size="22" text-anchor="start" >Vom Tablet ins Vault — der Hinweg</text>
<text x="40" y="62" fill="#1e1e1e" font-size="13" text-anchor="start" >Alle 15 Minuten. Deterministisch, ohne Sprachmodell.</text>
<text x="140" y="155" fill="#1971c2" font-size="16" text-anchor="middle" font-weight="600">Tablet</text>
<text x="140" y="175" fill="#1971c2" font-size="16" text-anchor="middle" font-weight="600">[ACME] Zonenskizze</text>
<text x="465" y="155" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">Dienstpostfach</text>
<text x="465" y="175" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">tablet@example.com</text>
<text x="790" y="155" fill="#2f9e44" font-size="16" text-anchor="middle" font-weight="600">Abholer</text>
<text x="790" y="175" fill="#2f9e44" font-size="16" text-anchor="middle" font-weight="600">DMARC-Gate</text>
<text x="1120" y="155" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">Bibliothek</text>
<text x="1120" y="175" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">Status = Neu</text>
<text x="268" y="153" fill="#1e1e1e" font-size="12" text-anchor="start" >Mail + PDF</text>
<text x="595" y="153" fill="#1e1e1e" font-size="12" text-anchor="start" >alle 15 Min</text>
<text x="931" y="153" fill="#1e1e1e" font-size="12" text-anchor="start" >Upload</text>
<text x="1120" y="290" fill="#e03131" font-size="16" text-anchor="middle" font-weight="600">abgewiesen</text>
<text x="1120" y="310" fill="#e03131" font-size="16" text-anchor="middle" font-weight="600">gezählt, nie still weg</text>
<text x="857" y="230" fill="#e03131" font-size="12" text-anchor="start" >DMARC scheitert</text>
<text x="1120" y="445" fill="#2f9e44" font-size="16" text-anchor="middle" font-weight="600">Zuordner</text>
<text x="1120" y="465" fill="#2f9e44" font-size="16" text-anchor="middle" font-weight="600">Kürzel auflösen</text>
<text x="770" y="445" fill="#e03131" font-size="16" text-anchor="middle" font-weight="600">Ohne Zuordnung</text>
<text x="770" y="465" fill="#e03131" font-size="16" text-anchor="middle" font-weight="600">wartet sichtbar</text>
<text x="920" y="443" fill="#e03131" font-size="12" text-anchor="start" >kein Kürzel</text>
<text x="883" y="363" fill="#2f9e44" font-size="12" text-anchor="start" >umbenennen</text>
<text x="1120" y="600" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">Zeiger-Notiz</text>
<text x="1120" y="620" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">im Projekt</text>
<text x="1120" y="640" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">+ Textauszug</text>
<text x="1091" y="523" fill="#1e1e1e" font-size="12" text-anchor="start" >eindeutig</text>
<text x="770" y="610" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">Projekt-Hub</text>
<text x="770" y="630" fill="#f08c00" font-size="16" text-anchor="middle" font-weight="600">zeigt sie per Abfrage</text>
<text x="40" y="433" fill="#1e1e1e" font-size="14" text-anchor="start" >Das PDF bleibt in der</text>
<text x="40" y="451" fill="#1e1e1e" font-size="14" text-anchor="start" >Bibliothek. Ins Vault</text>
<text x="40" y="468" fill="#1e1e1e" font-size="14" text-anchor="start" >kommt ein Zeiger,</text>
<text x="40" y="486" fill="#1e1e1e" font-size="14" text-anchor="start" >kein Inhalt.  (E-01)</text>
<text x="40" y="573" fill="#1e1e1e" font-size="14" text-anchor="start" >Der Kreis über</text>
<text x="40" y="591" fill="#1e1e1e" font-size="14" text-anchor="start" >«Ohne Zuordnung»</text>
<text x="40" y="608" fill="#1e1e1e" font-size="14" text-anchor="start" >ist die Selbstheilung:</text>
<text x="40" y="626" fill="#1e1e1e" font-size="14" text-anchor="start" >nichts geht verloren.</text>
